[package]
name = "ap-cli"
description = "Agent Access CLI"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aac"
path = "src/main.rs"

[features]
default = ["bws", "openshell"]
# Bitwarden Secrets Manager provider. Pulls the full Secrets Manager SDK
# (reqwest/rustls/rsa/argon2) into the binary; disable it if you only use the
# `bitwarden` CLI or `example` providers.
bws = ["dep:bitwarden"]
# `aac openshell-driver`: Bitwarden as an NVIDIA OpenShell credential driver
# (spawned by openshell-gateway). On by default so the aac bundled with the
# desktop app includes it.
openshell = ["dep:ap-openshell"]

[dependencies]
ap-noise = { workspace = true }
ap-relay-client = { workspace = true, features = ["native-websocket"] }
ap-relay-protocol = { workspace = true }
ap-client = { workspace = true, features = ["native-websocket"] }
ap-openshell = { path = "../ap-openshell", optional = true }
async-trait = { workspace = true }
bitwarden = { workspace = true, optional = true }
# In-process secret-scanning engine for the MCP `scan_secrets` tool. Not part
# of the `bws` feature: scanning is core to the MCP surface and must survive
# `--no-default-features` (the bundled-desktop build).
bitwarden-scan = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
crossterm = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "process"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
secrecy = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
